name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: windows-amd64
            runner: windows-2022
          - os: windows-arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            xvfb openbox x11-utils \
            python3-xlib libx11-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary "cryptography>=43.0"
          pip install --prefer-binary -r requirements.txt pytest

      - name: Run tests (Linux)
        if: matrix.os == 'linux'
        run: |
          pytest tests/test_congestion_policy.py \
                 tests/test_bitrate_ramp.py \
                 tests/test_handler_policy.py \
                 tests/test_wire_header.py \
                 tests/test_frontend_lag_clock.py \
                 tests/test_clipboard.py \
                 tests/test_platform_keys.py \
                 tests/test_codec_probe.py \
                 tests/test_headless.py \
                 tests/test_server_lifecycle.py \
                 tests/test_x11_keyboard_loopback.py \
                 -v

      - name: Run tests (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pytest tests/test_congestion_policy.py `
                 tests/test_bitrate_ramp.py `
                 tests/test_handler_policy.py `
                 tests/test_wire_header.py `
                 tests/test_frontend_lag_clock.py `
                 tests/test_clipboard.py `
                 tests/test_platform_keys.py `
                 tests/test_codec_probe.py `
                 tests/test_headless.py `
                 tests/test_server_lifecycle.py `
                 -v
